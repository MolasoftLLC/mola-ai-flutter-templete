name: mola_gemini_flutter_template
description: "A new Flutter project with Gemini."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 5.0.14+85

environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_generative_ai: ^0.3.2
  provider: ^6.1.2
  freezed: ^2.4.6
  path_provider: ^2.1.3
  flutter_state_notifier:
  freezed_annotation: ^2.4.1

  #AppIcon
  flutter_launcher_icons: ^0.14.4

  #Splash
  flutter_native_splash: ^2.4.8

  #ローカルDB
  shared_preferences: ^2.2.2

  #Http通信
  chopper: ^6.1.4
  http: ^1.2.2
  http_parser: ^4.0.2
  path: ^1.9.0
  state_notifier: ^1.0.0
  json_annotation: ^4.9.0

  # logger
  simple_logger: ^1.8.0+1

  # 環境変数
  flutter_dotenv: ^5.1.0

  #lottie
  lottie: ^3.5.1

  #画像選択
  image_picker: ^1.2.3
  # 酒ラベル高速スキャン（Android SDK 24+ / iOS 13+）
  camera: ^0.12.0+2
  image: ^4.9.2

  #Slider
  syncfusion_flutter_sliders: ^34.2.4

  url_launcher: ^6.2.6


  #　同期
  rxdart: ^0.28.0
  synchronized: ^3.1.0

  app_tracking_transparency: ^2.0.5

  package_info_plus: ^8.0.0
  version: ^3.0.2
  
  #画像圧縮
  flutter_image_compress: ^2.2.0
  
  #広告
  google_mobile_ads: ^7.0.0
  
  #画像をギャラリーに保存
  image_gallery_saver_plus: ^5.1.1

  
  #画像のクロップと回転
  # UISceneDelegate を使用する現行FlutterのiOSライフサイクルに対応
  image_cropper: ^12.2.1

  #日付フォーマット
  intl: any

  # 飲んだ場所の現在地・店舗検索
  geolocator: ^12.0.0
  # 2.15+のweb 1.xは現在のFirebase 2.x系列と競合するため互換版を固定。
  google_maps_flutter: 2.14.2

  # ビュー可視判定
  visibility_detector: ^0.4.0+2

  # UI チュートリアル
  tutorial_coach_mark: 1.2.11

  # Firebase
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.9
  chopper_generator: ^6.0.3

  # Serializer
  json_serializable: ^6.8.0

flutter:
  generate: true
  config:
    # 一部のiOSプラグインがCocoaPodsのみ対応のため、依存管理をCocoaPodsへ統一する。
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/data/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/sake_icon.jpg"

flutter_native_splash:
  android: true
  ios: false
  web: false
  image: "assets/images/sake_logo.png"
  color: "#1D3567"
  android_gravity: center
  android_12:
    # Android 12の円形マスク用余白はdrawable-anydpi-v31で適用する。
    image: "assets/images/sake_logo.png"
    color: "#1D3567"
